# Weekly version updates. Security updates are enabled in the repository settings
# and are opened as soon as an advisory is published, without the cooldown.
#
# Minor and patch updates are grouped into one pull request. Each major update gets its
# own, so a breaking change can't hide in a group (TypeScript 7 broke the build that way).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait a week after a release, so a compromised version is more likely to be noticed first.
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Node's type definitions follow the Node version in the deploy workflow, not the latest.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # @astrojs/check only supports TypeScript 5 and 6. Remove this once it supports 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "ci(deps)"
